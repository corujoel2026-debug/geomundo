<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Top green bar -->
  <rect width="300" height="50" fill="#006600"/>
  <!-- Middle white bar -->
  <rect y="50" width="300" height="50" fill="#ffffff"/>
  <!-- Bottom red bar -->
  <rect y="100" width="300" height="50" fill="#cc0000"/>
  <!-- Black 5-pointed star in center of white bar -->
  <polygon points="150,57 155,71 169,71 158,80 162,94 150,85 138,94 142,80 131,71 145,71" fill="#000000"/>
  <!-- Shahada in white on green bar (with fallbacks and glyph paths) -->
  <g fill="#ffffff" transform="translate(150, 32)">
    <text text-anchor="middle" font-family="'Scheherazade New', 'Amiri', 'Traditional Arabic', sans-serif" font-weight="bold" font-size="16" letter-spacing="1">لَا إِلٰهَ إِلَّا الله مُحَمَّدٌ رَسُولُ الله</text>
  </g>
</svg>
