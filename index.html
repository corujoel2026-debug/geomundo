    <meta property="og:title" content="GeoMundo - Memoriza los Países del Mundo" />
    <meta property="og:description" content="Aprende y memoriza todos los países, capitales y banderas del mundo organizados por continentes con flashcards interactivas, mapas y quizzes con repetición espaciada." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GeoMundo" />
    <meta name="application-name" content="GeoMundo" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('geomundo_theme_mode');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased selection:bg-stone-200 dark:selection:bg-stone-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
